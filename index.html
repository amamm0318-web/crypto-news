<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كريبتو حصري – أخبار الكريبتو</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--surface:#fff;--text:#12141c;--muted:#626a7d;--line:#e3e6ef;--accent:#f7931a;--accent2:#6d5dfc;--up:#0f9d58;--down:#d93025;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e17;--surface:#141926;--text:#eef1f8;--muted:#9aa3b8;--line:#232b3d;--up:#2ecc8f;--down:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e17;--surface:#141926;--text:#eef1f8;--muted:#9aa3b8;--line:#232b3d;--up:#2ecc8f;--down:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--accent)}
.btn{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.ticker{display:flex;gap:10px;overflow-x:auto;padding:12px 16px}
.coin{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:120px}
.coin small{color:var(--muted)}.coin div{font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
main{max-width:900px;margin:0 auto;padding:0 16px 40px}
.note{font-size:12px;color:var(--muted);margin:0 0 12px}
input[type=search]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:17px;line-height:1.5}
.card p{margin:0;color:var(--muted);font-size:14px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tag{background:var(--accent2);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
.hot{background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.star{background:none;border:0;font-size:20px;cursor:pointer;color:var(--accent);padding:0}
.hero{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;cursor:pointer}
.hero h2{margin:6px 0;font-size:22px;line-height:1.4}.hero p{margin:0;opacity:.92}
.empty{text-align:center;color:var(--muted);padding:30px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
.sheet{background:var(--surface);color:var(--text);width:100%;max-width:700px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:8px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.tabs{display:flex;gap:8px;padding:12px 16px 0;max-width:900px;margin:0 auto}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mtools{display:flex;gap:8px;margin:12px 0}.mtools input{flex:1;min-width:0}
.mtools select{padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;max-width:150px}
.mrow{display:grid;grid-template-columns:28px 30px 1fr auto 70px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mrow .rk{color:var(--muted);font-size:12px}.mrow img{border-radius:50%}
.mrow .nm,.mrow .pr{display:flex;flex-direction:column;min-width:0}.mrow .pr{text-align:left;direction:ltr}
.mrow small{color:var(--muted);font-size:12px}.mrow .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mc{font-size:12px;color:var(--muted);text-align:left;direction:ltr}
.mrow .pr small.up{color:var(--up)}.mrow .pr small.down{color:var(--down)}
@media(max-width:480px){.mrow{grid-template-columns:22px 28px 1fr auto}.mrow .mc{display:none}}
.lrow{display:block;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.lrow:hover{border-color:var(--accent)}.lrow h3{margin:8px 0 0;font-size:16px;line-height:1.5}
.lrow a{color:inherit;text-decoration:none;display:block}
.lrow .tr{margin:8px 0 0;color:var(--muted);font-size:14px}
.lrow .trb{margin-top:8px;font-size:13px;padding:4px 10px}
</style>
</head>

<script>
var COINS=[["BTC · 24 أكتوبر","بيتكوين","≈ $80,138","down"],["ETH · 19 أكتوبر","إيثريوم","≈ $2,412",""],["BTC سنة","مقارنة بعام","−26%","down"],["Brent · 16 أكتوبر","النفط","> $106","up"]];
var NEWS=[
{id:7,cat:"أمان",hot:1,t:"اختراق Keystone: الجهاز سليم، ولكن عناوين الزبناء خرجات",s:"أسماء وعناوين الشحن وتفاصيل الطلبات تسربات، والمفاتيح الخاصة ما تأثراتش.",b:"أعلنات شركة Keystone لمحافظ الأجهزة أن شي طرف دخل لموقعها بلا إذن. حسب التقارير، الدخول تكشف نهار 20 أكتوبر وتأكدات سرقة البيانات نهار 23. اللي تسرب: الأسماء، معلومات الاتصال، عناوين الشحن، وتفاصيل الطلبات (شنو شراو وبشحال). اللي ما تسربش، حسب الشركة: بيانات الدفع والبنك، المفاتيح الخاصة، عبارات الاسترداد وكلمات سر المحفظة. الشركة سدات الثغرة وبدات كتبلغ الزبناء، وعدات بتقرير مفصل.<br><br>القراءة ديالي: هاد الحادث كيبين بلي أمان المحفظة عندو جوج دوائر. الدائرة التشفيرية (الجهاز) كانت سليمة. ولكن الدائرة التجارية (المتجر والبيانات) هي اللي تخرقات. واللائحة اللي خرجات خطيرة بطبيعتها: كتجمع اسم الشخص وعنوانو والمعلومة أنو شرا محفظة كريبتو. هادشي كيسهل على المحتالين يتنكرو فشخصية الشركة ويعرضو «استرداد» ولا «جهاز بديل»، وكيزيد خطر الاستهداف حتى خارج الإنترنت.<br><br>نقطة كتستاهل الانتباه: ذكرات Cointelegraph أن الشركة وعدات فـ 2023 تنقص مدة حفظ البيانات لـ 180 يوم، ومع هادشي كاين زبناء توصلو بإشعار رغم أنهم شراو من أكثر من عامين. الشركة ما جاوباتش دابا على كيفاش، ولا على عدد المتضررين. وهادشي جا بعد حوادث فقطاع محافظ الأجهزة هاد العام، بحال Trezor فغشت (عبر مزود الشحن ShipMonk).<br><br>شنو دير:<br>1. ما تفتح حتى رابط جاك فرسالة تدعي أنها من Keystone، وادخل للموقع الرسمي بيدك.<br>2. عبارة الاسترداد ما كتتعطى لحتى جهة، ولا كتتكتب فحتى موقع.<br>3. إلا توصلتي بعرض استرداد أو جهاز جديد، اعتبرو احتيال حتى يثبت العكس.<br>4. ما تعلنش أنك كتملك كريبتو، وراجع عنوان الشحن إلا قدرتي تغير.<br><br>تحليل مبني على وقائع منشورة يوم 24-26 أكتوبر 2026، ماشي نصيحة مالية.",d:"تحليل · 26 أكتوبر 2026"},
{id:8,cat:"تنظيم",hot:1,t:"الشركات الكبرى كترفض الأسهم المرمّزة: شنو وراء هاد الرفض؟",s:"من اعتراض وحد فـ 4 أكتوبر لـ 16 شركة فأقل من أسبوعين على منصة OKXICE.",b:"المنصة المرتقبة OKXICE (مشروع مشترك بين OKX وICE، مالكة بورصة نيويورك) كانت كتخطط تقدم تداول 24/7 لأسهم مرمّزة ديال 62 شركة أمريكية. حسب التقارير، الاعتراضات تزايدات بسرعة: واحد فـ 4 أكتوبر، 9 فـ 15 أكتوبر، و16 فـ 19-20 أكتوبر، بما فيهم Microsoft وAlphabet وGoldman Sachs وVerizon وBroadcom. وآخر عنوان فDecrypt كيتكلم على 6 شركات أخرى، منهم Wells Fargo وCisco وIntuit. والإعلانات ما شرحاتش الأسباب.<br><br>الخلفية: ترخيص من SEC (إعفاء TSV) كيخلي منصات تتداول أسهم مرمّزة بلا ما تتسجل كبورصات. الإعفاء كيفرض أن الشركة المعنية تتبلغ وتقدر تعترض. وNasdaq قالت أنها غتخرج أسهمها من هاد الإعفاء.<br><br>قراءتي (فرضيات ماشي حقائق): أولا، الرموز اللي كتتداول كتتصاوب من طرف ثالث ماشي من الشركة، وهادشي كيطرح سؤال: شكون كيضمن الحقوق (الأرباح، التصويت)؟ ثانيا، الشركات غالبا كتفضل تتحكم فكيفاش كيتعرض سهمها وبأي سمعة. ثالثا، هاد الاعتراض ماشي رفض للتقنية كاملة: Securitize مثلا قالت أن الشركات ممكن تعترض على منصة وحدة بلا ما ترفض الترميز. ومن اللافت أن النسخة الأخيرة من الإعلان كتقول أن الترميز ممكن يكون من الشركة نفسها، وهادشي كيعطيها دور مباشر أكبر.<br><br>الأرقام للسياق: قيمة الأسهم المرمّزة حوالي 3.5 مليار دولار حسب The Block، وصندوق النقد الدولي لاحظ طلب حقيقي خصوصا خارج ساعات السوق، ولكن مع تقلب وسيولة ضعيفة.<br><br>الخلاصة: الترميز كيدخل لـWall Street من باب التنظيم، ولكن موافقة الشركات نفسها بقات عقبة. غنتتبعو واش غتتغير الصيغة وتولي الشركات هي اللي ترمّز.<br><br>تحليل مبني على تقارير 15-25 أكتوبر 2026، ماشي نصيحة مالية.",d:"تحليل · 26 أكتوبر 2026"},
{id:1,cat:"بيتكوين",hot:1,t:"تحليل: شنو كيقولو لينا 436 مليون دولار من التصفيات؟",s:"حوالي 93% من التصفيات كانت ديال مراكز الشراء، وهادشي كيعني بزاف.",b:"فـ 24 أكتوبر نزلات بيتكوين لحوالي 79,280 دولار، وتصفيات 4 ساعات وصلات 436.44 مليون دولار. المثير هو التوزيع: 404.15 مليون منها كانت مراكز شراء بالرافعة، يعني تقريبا 93%.<br><br>هادشي كيبين بلي السوق كان مزدحم فجهة وحدة: بزاف ديال المتداولين كانو مراهنين على الصعود بالاستدانة. ملي السعر كينزل شوية، المنصة كتسد المراكز بالقوة، وهاد الإغلاق كيزيد يضغط على السعر، وكتولي سلسلة.<br><br>النقطة الأهم: هاد النوع ديال النزول كيكون سريع ولكن ماشي دايما دليل على ضعف أساسي. السعر رجع لقرب 80 ألف فنفس النهار. المتابع الذكي كيشوف حجم الرافعة فالسوق قبل ما يحكم على الحركة.<br><br>تحليل ديال الوقائع المنشورة ليوم 24 أكتوبر 2026، ماشي نصيحة مالية.",d:"تحليل · 24 أكتوبر 2026"},
{id:2,cat:"أمان",hot:1,t:"تنبيه Electrum: شنو خاصك دير قبل ما تحدث محفظتك",s:"خطوات بسيطة باش ما تطيحش فنسخة مزورة وانت كتحدث.",b:"أعلنات Electrum أن النسخة 4.8.3 كتعالج مشكل أمني خطير، وطلبات من كاع المستعملين يحدثو. التفاصيل التقنية ما كانتش مفصلة، وهادشي عادي فهاد النوع ديال التنبيهات.<br><br>اللحظة اللي كيتم فيها الإعلان عن تحديث أمني هي اللحظة اللي كيستغلها المحتالين كذلك، بنشر نسخ مزورة وروابط مزيفة. لهادا خاصك:<br>1. تحمل غير من الموقع الرسمي، وكتكتب العنوان بيدك.<br>2. تتحقق من التوقيع الرقمي للملف، حيت الموقع كيوفر خطوات ديال هاد التحقق.<br>3. ما تتبعش رابط جاك فرسالة ولا تعليق.<br>4. تخزن العبارة السرية بعيد على الكمبيوتر.<br><br>القاعدة العامة: التحديث السريع ضروري، ولكن التحديث من المصدر الصحيح أهم.",d:"تحليل · 24 أكتوبر 2026"},
{id:3,cat:"DeFi",hot:1,t:"قراءة فهجوم Initia: كيفاش كيتخلقو أرصدة بلا غطاء؟",s:"المهاجم ما لمسش عرض عملة INIT، ولكن خلق أصول مزيفة فأماكن أخرى.",b:"حسب تحديث المشروع، خلل برمجي خلا المهاجم يتجاوز فحوصات الأمان ويخلق أرصدة ما عندها غطاء، بلا ما يتغير عرض INIT نفسها. حوالي 2.7 مليون دولار خرجات وتحولات لـ 1,135.52 ETH، وهادشي كيعني سعر تقريبي 2,378 دولار للوحدة.<br><br>الدرس هنا: ملي كتكون أصول ممثلة (مثلا عبر جسور ولا سلاسل فرعية)، الخطر ماشي دايما فالعملة الأصلية، ولكن فالمنطق اللي كيربط بين الأصل الحقيقي ونسخته. إلا تكسر هاد الفحص، النسخة كتولي بلا قيمة.<br><br>شنو كيقدر دير المستخدم: يتتبع إعلانات المشروع الرسمية، ما يتسرعش يبيع ولا يشري وسط الأزمة، ويفهم شنو كيرتبط بشنو قبل ما يحط فلوسو. المشروع قال بلي الإصلاح والتدقيق غياخدو عدة أيام والشبكة موقفة.",d:"تحليل · 24 أكتوبر 2026"},
{id:4,cat:"تعدين",hot:0,t:"ليش Tether كتدير أدوات تعدين مفتوحة المصدر؟",s:"15 جهة مشاركة، والفكرة هي واجهة وحدة لمعدات مختلفة.",b:"أعلنات Tether أن 15 جهة، بما فيها Bitmain وBitdeer وCanaan وFoundry Digital وProto ديال Block، التزمات بتطوير ربط مع Mining Development Kit. الهدف نسخة 1.0 مستقرة قبل نهاية 2026.<br><br>فاش كتفيد هادشي؟ المعدنين اليوم كيستعملو برامج مختلفة لكل مزود، وكل شركة عندها نظامها. واجهة مشتركة كتسهل تسيير مزرعة فيها معدات من أكثر من شركة، وكتنقص التبعية لمزود واحد.<br><br>الحذر: الالتزام بالتطوير ماشي هو الاستعمال الفعلي. غنشوفو الأثر حقيقي ملي تخرج النسخة المستقرة وكيبداو المعدنين يخدمو بها.",d:"تحليل · 24 أكتوبر 2026"},
{id:5,cat:"تداول",hot:0,t:"Arthur Hayes جنا الأرباح: شنو نفهمو وشنو لا؟",s:"بيع ETH وENA وUNI ماشي توقع قاطع على السوق.",b:"قال Arthur Hayes أنه سد المراكز الاتجاهية فمكتبه العائلي Maelstrom، وذكر ETH وENA وUNI، وعلل ذلك بجني الأرباح بسبب قلق اقتصادي وجيوسياسي. ما حدد موعد للرجوع.<br><br>شنو كيقدر يقولو هاد الخبر: مستثمر معروف قرر يقلل المخاطرة. شنو ما كيقدرش يقولو: أن السوق غيطيح. مدير محفظة كيقلل التعرض لأسباب بزاف، منها إدارة المخاطر ديالو هو.<br><br>القاعدة: ما تبنيش قرار على تغريدة ديال شخص مشهور. شوف الخطة ديالك، المدة اللي غتحتفظ فيها، والمبلغ اللي تقدر تتحمل تخسرو.",d:"تحليل · 24 أكتوبر 2026"},

var cats=["الكل"].concat(Array.from(new Set(NEWS.map(function(n){return n.cat}))));
var cur="الكل",onlySaved=false,saved=[];
try{saved=JSON.parse(localStorage.getItem("saved")||"[]")}catch(e){}
function persist(){try{localStorage.setItem("saved",JSON.stringify(saved))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function drawStatic(){$("ticker").innerHTML=COINS.map(function(c){return '<div class="coin"><small>'+c[1]+' · '+c[0]+'</small><div class="'+c[3]+'">'+c[2]+'</div></div>'}).join("")}
var IDS={bitcoin:["BTC","بيتكوين"],ethereum:["ETH","إيثريوم"],solana:["SOL","سولانا"],binancecoin:["BNB","بي إن بي"],ripple:["XRP","ريبل"]};
function cget(k,ttl){try{var o=JSON.parse(localStorage.getItem(k));if(o&&Date.now()-o.t<ttl)return o.d}catch(e){}return null}
function cset(k,d){try{localStorage.setItem(k,JSON.stringify({t:Date.now(),d:d}))}catch(e){}}
function drawLive(d){
  $("ticker").innerHTML=Object.keys(IDS).filter(function(k){return d[k]}).map(function(k){
    var p=d[k].usd,ch=d[k].usd_24h_change||0,up=ch>=0;
    return '<div class="coin"><small>'+IDS[k][1]+' · '+IDS[k][0]+'</small><div>$'+p.toLocaleString("en-US",{maximumFractionDigits:p<10?4:2})+'</div><small class="'+(up?"up":"down")+'">'+(up?"▲ ":"▼ ")+Math.abs(ch).toFixed(2)+'%</small></div>'}).join("");
}
function live(){
  var c=cget("tk",60000);if(c){drawLive(c);return}
  fetch("https://api.coingecko.com/api/v3/simple/price?ids="+Object.keys(IDS).join(",")+"&vs_currencies=usd&include_24hr_change=true")
  .then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(d){cset("tk",d);drawLive(d)}).catch(drawStatic);
}
drawStatic();live();setInterval(live,180000);;
function chips(){$("chips").innerHTML=cats.map(function(c){return '<button class="chip'+(c==cur&&!onlySaved?" on":"")+'" data-c="'+c+'">'+c+'</button>'}).join("")}
function card(n){return '<div class="card" data-id="'+n.id+'"><div class="meta"><span>'+(n.hot?'<span class="hot">تحليل</span> ':'')+'<span class="tag">'+n.cat+'</span></span><button class="star" data-s="'+n.id+'">'+(saved.indexOf(n.id)>-1?"★":"☆")+'</button></div><h3>'+n.t+'</h3><p>'+n.s+'</p><div class="meta">'+n.d+'</div></div>'}
function render(){
  chips();var q=$("q").value.trim();
  var list=NEWS.filter(function(n){return(onlySaved?saved.indexOf(n.id)>-1:(cur=="الكل"||n.cat==cur))&&(!q||(n.t+n.s).indexOf(q)>-1)});
  var h=NEWS[0];
  $("heroBox").innerHTML=(cur=="الكل"&&!q&&!onlySaved)?'<div class="hero" data-id="'+h.id+'"><span class="hot" style="background:#fff;color:#c26a00">التحليل الأبرز</span><h2>'+h.t+'</h2><p>'+h.s+'</p></div>':"";
  $("grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty">ما كاين حتى نتيجة</div>';
}
document.addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){e.stopPropagation();var id=+s.dataset.s,i=saved.indexOf(id);if(i>-1)saved.splice(i,1);else saved.push(id);persist();render();return}
  var c=e.target.closest(".chip");if(c){cur=c.dataset.c;onlySaved=false;render();return}
  var k=e.target.closest("[data-id]");
  if(k){var n=NEWS.filter(function(x){return x.id==k.dataset.id})[0];
    $("sheet").innerHTML='<button class="btn" id="close">✕ سد</button><h2>'+n.t+'</h2><div class="meta"><span class="tag">'+n.cat+'</span><span>'+n.d+'</span></div><p>'+n.b+'</p>';
    $("modal").classList.add("open");return}
  if(e.target.id=="close"||e.target.id=="modal")$("modal").classList.remove("open");
});
$("q").addEventListener("input",render);
$("savedBtn").onclick=function(){onlySaved=!onlySaved;render()};
$("themeBtn").onclick=function(){var d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark"};
render();
var mk=[],mpage=0,mbusy=false,msort="rank";
function mfmt(n){if(n==null)return "—";return "$"+n.toLocaleString("en-US",n>=1?{maximumFractionDigits:2}:{maximumSignificantDigits:4})}
function mbig(n){if(!n)return "—";var u=[["T",1e12],["B",1e9],["M",1e6]];for(var i=0;i<u.length;i++)if(n>=u[i][1])return "$"+(n/u[i][1]).toFixed(2)+u[i][0];return "$"+n.toLocaleString("en-US")}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mrender(){
  var q=$("mq").value.trim().toLowerCase();
  var list=mk.filter(function(c){return!q||c.name.toLowerCase().indexOf(q)>-1||c.symbol.toLowerCase().indexOf(q)>-1});
  if(msort=="up")list=list.slice().sort(function(a,b){return(b.price_change_percentage_24h||-999)-(a.price_change_percentage_24h||-999)});
  if(msort=="down")list=list.slice().sort(function(a,b){return(a.price_change_percentage_24h||999)-(b.price_change_percentage_24h||999)});
  $("mrows").innerHTML=list.map(function(c){
    var ch=c.price_change_percentage_24h,up=ch>=0;
    return '<div class="mrow"><span class="rk">'+(c.market_cap_rank||"–")+'</span><img src="'+esc(c.image)+'" alt="" loading="lazy" width="30" height="30"><div class="nm"><b>'+esc(c.name)+'</b><small>'+esc(c.symbol.toUpperCase())+'</small></div><div class="pr"><b>'+mfmt(c.current_price)+'</b><small class="'+(ch==null?"":up?"up":"down")+'">'+(ch==null?"—":(up?"▲ ":"▼ ")+Math.abs(ch).toFixed(2)+"%")+'</small></div><div class="mc">'+mbig(c.market_cap)+'</div></div>'}).join("")||'<div class="empty">ما كاين حتى عملة</div>';
}
function mload(reset,force){
  if(mbusy)return;mbusy=true;if(reset){mk=[];mpage=0}
  $("mmsg").textContent="كنجيب الأسعار…";$("mmore").style.display="none";
  var key="mk"+(mpage+1),c=force?null:cget(key,60000);
  var p=c?Promise.resolve(c):fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page="+(mpage+1)+"&sparkline=false")
    .then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(d){cset(key,d);return d});
  p.then(function(d){mpage++;mk=mk.concat(d);$("mmsg").textContent="كتحدث من CoinGecko · "+mk.length+" عملة";$("mmore").style.display=d.length?"block":"none";mrender()})
  .catch(function(e){$("mmsg").textContent=e==429?"وصلنا للحد ديال الطلبات، عاود من بعد دقيقة.":"تعذر الاتصال بـ CoinGecko. عاود المحاولة.";$("mmore").style.display=mk.length?"block":"none"})
  .then(function(){mbusy=false});
}
function showTab(t){
  var v={news:"newsView",market:"marketView",live:"liveView"},b={news:"tabNews",market:"tabMarket",live:"tabLive"};
  for(var k in v){$(v[k]).hidden=k!=t;$(b[k]).classList.toggle("on",k==t)}
  if(t=="market"&&!mk.length)mload(true);
  if(t=="live"&&!lv.length)lvload();
}
var lv=[];
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);if(isNaN(m))return "";if(m<60)return "قبل "+Math.max(m,1)+" دقيقة";var h=Math.round(m/60);if(h<24)return "قبل "+h+" ساعة";return "قبل "+Math.round(h/24)+" يوم"}
var lvlist=[];
function lvrender(){
  var q=$("lq").value.trim().toLowerCase();
  lvlist=lv.filter(function(a){return!q||a.title.toLowerCase().indexOf(q)>-1||a.source.toLowerCase().indexOf(q)>-1});
  $("lrows").innerHTML=lvlist.map(function(a,i){return '<div class="lrow"><div class="meta"><span class="tag">'+esc(a.source)+'</span><span>'+ago(a.published)+'</span></div><a href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer"><h3>'+esc(a.title)+'</h3></a><p class="tr" id="tr'+i+'"></p><button class="btn trb" data-t="'+i+'">🌐 ترجم</button></div>'}).join("")||'<div class="empty">ما كاين حتى خبر</div>';
}
function trShow(i,t){var e=$("tr"+i);if(e)e.textContent=t}
function trDo(i){
  var a=lvlist[i];if(!a)return;
  var c=cget("tr:"+a.title,6048e5);if(c){trShow(i,c);return}
  trShow(i,"كنترجم…");
  fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(a.title)+"&langpair=en|ar")
  .then(function(r){return r.json()})
  .then(function(d){if(String(d.responseStatus)!="200"||!d.responseData||!d.responseData.translatedText)throw 0;var t=d.responseData.translatedText+" (ترجمة آلية)";cset("tr:"+a.title,t);trShow(i,t)})
  .catch(function(){trShow(i,"تعذرت الترجمة دابا (ممكن وصلنا للحد اليومي).")});
}
var FEEDS=[["CoinDesk","https://www.coindesk.com/arc/outboundfeeds/rss"],["Cointelegraph","https://cointelegraph.com/rss"],["Decrypt","https://decrypt.co/feed"]];
function isoD(s){var d=new Date(String(s).replace(" ","T")+"Z");return isNaN(d)?new Date().toISOString():d.toISOString()}
function lvdone(){
  $("lmsg").textContent=lv.length?"عناوين من مصادر عامة، الضغط كيحيلك للمقال الأصلي":"ما بقاو عناوين بعد. شغل الـ workflow فتبويب Actions (Update news) أول مرة.";
  lvrender();
}
function lvload(){
  $("lmsg").textContent="كنجيب العناوين…";
  var c=cget("lv",600000);if(c){lv=c;lvdone();return}
  fetch("news.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var l=(d.items||[]).filter(function(x){return x.title&&/^https?:\/\//.test(x.url)});
    if(!l.length)throw 0;lv=l;cset("lv",lv);lvdone();
  }).catch(function(){
    Promise.all(FEEDS.map(function(f){
      return fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f[1]))
      .then(function(r){return r.json()})
      .then(function(d){return(d.items||[]).map(function(it){return{source:f[0],title:it.title,url:it.link,published:isoD(it.pubDate)}})})
      .catch(function(){return[]});
    })).then(function(a){
      lv=[].concat.apply([],a).filter(function(x){return x.title&&/^https?:\/\//.test(x.url)}).sort(function(x,y){return y.published>x.published?1:-1});
      if(lv.length)cset("lv",lv);lvdone();
    });
  });
}
$("tabLive").onclick=function(){showTab("live")};
$("lq").addEventListener("input",lvrender);
$("lrows").addEventListener("click",function(e){var b=e.target.closest("[data-t]");if(b)trDo(+b.dataset.t)});
$("tabNews").onclick=function(){showTab("news")};
$("tabMarket").onclick=function(){showTab("market")};
$("mq").addEventListener("input",mrender);
$("msort").addEventListener("change",function(){msort=this.value;mrender()});
$("mmore").onclick=function(){mload(false)};
$("mref").onclick=function(){mload(true,true)};
</script>
